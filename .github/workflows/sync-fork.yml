name: 每周自动同步上游源

on:
  schedule:
    # 每7天执行一次，周日凌晨2点运行
    - cron: '0 2 */7 * *'
  workflow_dispatch:  # 加这个就可以在Actions页面手动点按钮运行测试

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 自动同步上游仓库
        uses: repo-sync/pull-request@v2
        with:
          source_repository: qist/tvbox
          destination_branch: "master"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "自动同步上游源更新"
          pr_body: "由定时工作流自动提交的同步更新"
